name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Python syntax
        run: python3 -m py_compile main.py __init__.py

      - name: Validate plugin configuration JSON
        run: python3 -m json.tool _conf_schema.json > /dev/null
